apiVersion: apps/v1
kind: Deployment
metadata:
  name: rooms-stable
  namespace: rooms-strategies
spec:
  replicas: 2
  minReadySeconds: 8
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: rooms-stable
  template:
    metadata:
      labels:
        app: rooms-stable
        lab: deployment-strategies
    spec:
      terminationGracePeriodSeconds: 25
      containers:
      - name: app
        image: meeting-rooms:deploy-v1
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: database
              key: url
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 2
          failureThreshold: 30
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - sleep 5
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rooms-stable
  namespace: rooms-strategies
spec:
  selector:
    app: rooms-stable
  ports:
  - name: http
    port: 8080
    targetPort: http
---
