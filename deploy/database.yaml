apiVersion: v1
kind: Namespace
metadata:
  name: rooms-strategies
---
apiVersion: v1
kind: Secret
metadata:
  name: database
  namespace: rooms-strategies
stringData:
  password: local-demo-password
  url: postgres://rooms:local-demo-password@postgres:5432/rooms?sslmode=disable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: rooms-strategies
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: rooms-strategies
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:17.11-alpine
        env:
        - name: POSTGRES_USER
          value: rooms
        - name: POSTGRES_DB
          value: rooms
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: database
              key: password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - rooms
            - -d
            - rooms
          periodSeconds: 2
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 256Mi
            cpu: 500m
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: rooms-strategies
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
