apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rooms
  namespace: rooms-strategies
spec:
  parentRefs:
  - name: rooms
  rules:
  - matches:
    - headers:
      - name: X-Audience
        value: beta
        type: Exact
    backendRefs:
    - name: rooms-green
      port: 8080
      weight: 1
  - backendRefs:
    - name: rooms-stable
      port: 8080
      weight: 1
