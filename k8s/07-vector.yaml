apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: meeting-rooms
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meeting-rooms-vector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meeting-rooms-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meeting-rooms-vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: meeting-rooms
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: meeting-rooms
data:
  vector.yaml: |
    data_dir: /var/lib/vector

    sources:
      app_logs:
        type: kubernetes_logs
        self_node_name: "${VECTOR_SELF_NODE_NAME}"
        extra_label_selector: "app=rooms-app"

    transforms:
      only_our_namespace:
        type: filter
        inputs:
          - app_logs
        condition: '.kubernetes.pod_namespace == "meeting-rooms"'

      parse_app_json:
        type: remap
        inputs:
          - only_our_namespace
        drop_on_error: true
        source: |
          app = object!(parse_json!(.message))
          . = merge(., app)

    sinks:
      victoria_logs:
        type: http
        inputs:
          - parse_app_json
        uri: "http://victoria-logs.meeting-rooms.svc.cluster.local:9428/insert/jsonline?_stream_fields=service.name,kubernetes.pod_name&_msg_field=message&_time_field=timestamp"
        method: post
        compression: gzip
        encoding:
          codec: json
        framing:
          method: newline_delimited
        healthcheck:
          enabled: false
        batch:
          timeout_secs: 1
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: meeting-rooms
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.49.0-debian
          args:
            - "--config"
            - "/etc/vector/vector.yaml"
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
        - name: data
          hostPath:
            path: /var/lib/meeting-rooms-vector
            type: DirectoryOrCreate