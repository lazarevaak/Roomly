apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: meeting-rooms
data:
  alertmanager.yaml: |
    route:
      receiver: local-ui
      group_by: [alertname, service_name]
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h
    receivers:
      - name: local-ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: meeting-rooms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yaml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address="
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: meeting-rooms
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
