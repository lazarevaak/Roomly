apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: meeting-rooms
data:
  alertmanager.yaml: |
    route:
      receiver: telegram
      group_by: [alertname, service]
      group_wait: 5s
      group_interval: 15s
      repeat_interval: 1h
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token_file: /etc/alertmanager-secrets/bot-token
            chat_id: 1415300064
            send_resolved: true
            parse_mode: ""
            message: |
              Статус: {{ .Status }}
              {{ range .Alerts }}
              Алерт: {{ .Labels.alertname }}
              {{ .Annotations.summary }}
              {{ .Annotations.description }}
              {{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: meeting-rooms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.28.1
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yaml"
            - "--storage.path=/alertmanager"
            - "--cluster.listen-address="
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: telegram
              mountPath: /etc/alertmanager-secrets
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: telegram
          secret:
            secretName: alertmanager-telegram
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: meeting-rooms
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http