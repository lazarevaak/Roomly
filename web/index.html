<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roomly — бронирование переговорных</title>
  <link rel="stylesheet" href="/styles.css">
</head>

<body>
  <main>
    <header>
      <div>
        <h1>Roomly</h1>
        <div class="subtitle">Сервис бронирования переговорных комнат</div>
      </div>

      <div id="user-panel" hidden>
        <span id="current-user" class="muted"></span>
        <button id="logout-button" class="secondary" type="button">Выйти</button>
      </div>
    </header>

    <section id="login-section" class="panel">
      <h2>Вход</h2>
      <form id="login-form" autocomplete="off">
        <div class="grid">
          <label>
            Логин
            <input id="username" autocomplete="off" required>
          </label>

          <label>
            Пароль
            <input id="password" type="password" autocomplete="new-password" required>
          </label>
        </div>

        <button type="submit">Войти</button>
      </form>

      <h2>Регистрация</h2>
      <form id="register-form">
        <div class="grid">
          <label>
            Новый логин
            <input id="register-username" autocomplete="username" maxlength="80" required>
          </label>

          <label>
            Новый пароль
            <input
              id="register-password"
              type="password"
              autocomplete="new-password"
              minlength="6"
              maxlength="120"
              required
            >
          </label>
        </div>

        <button type="submit">Зарегистрироваться</button>
      </form>
    </section>

    <p id="message" role="status"></p>

    <section id="app-section" hidden>
      <section class="panel">
        <h2>Смена пароля</h2>
        <form id="password-form">
          <div class="grid">
            <label>
              Текущий пароль
              <input id="current-password" type="password" autocomplete="current-password" required>
            </label>

            <label>
              Новый пароль
              <input
                id="new-password"
                type="password"
                autocomplete="new-password"
                minlength="6"
                maxlength="120"
                required
              >
            </label>
          </div>

          <button type="submit">Сменить пароль</button>
        </form>
      </section>

      <section id="room-admin-panel" class="panel">
        <h2 id="room-form-title">Добавить комнату</h2>
        <form id="room-form">
          <div class="grid">
            <label>
              Название
              <input id="room-name" placeholder="Например, Альфа" maxlength="100" required>
            </label>

            <label>
              Вместимость
              <input
                id="room-capacity"
                type="number"
                placeholder="Количество человек"
                min="1"
                max="2147483647"
                step="1"
                required
              >
            </label>

            <label>
              Расположение
              <input id="room-location" placeholder="Например, второй этаж" maxlength="200" required>
            </label>
          </div>

          <button id="room-save-button" type="submit">Добавить</button>
          <button id="room-cancel-button" class="secondary" type="button" hidden>Отменить</button>
        </form>
      </section>

      <section class="panel">
        <h2 id="booking-form-title">Добавить бронирование</h2>
        <form id="booking-form">
          <div class="grid">
            <label>
              Комната
              <select id="booking-room" required></select>
            </label>

            <label>
              Цель
              <input id="booking-purpose" placeholder="Например, планёрка" maxlength="200" required>
            </label>

            <label>
              Начало
              <input id="booking-start" type="datetime-local" required>
            </label>

            <label>
              Окончание
              <input id="booking-end" type="datetime-local" required>
            </label>
          </div>

          <button id="booking-save-button" type="submit">Забронировать</button>
          <button id="booking-cancel-button" class="secondary" type="button" hidden>Отменить</button>
        </form>
      </section>

      <div class="toolbar">
        <h2>Данные</h2>
        <button id="refresh-button" class="secondary" type="button">Обновить</button>
      </div>

      <div class="grid">
        <section>
          <h2>Комнаты</h2>
          <div id="rooms"></div>
        </section>

        <section>
          <h2>Бронирования</h2>
          <div id="bookings"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
